spring.application.name=Fatafat
spring.datasource.url=jdbc:mysql://localhost:3306/fatafat
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

admin.seed.email=${ADMIN_EMAIL}
admin.seed.password=${ADMIN_PASSWORD}

logging.level.org.springframework.security=DEBUG

jwt.secret=change-this-to-a-long-random-base64-string-at-least-256-bits
jwt.expiration-ms=86400000

user.not.found=User not found with emailId %s

cors.allowed-origins=http://localhost:3000

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.profiles.active=dev

onboarding.fee.amount=1000

# Razorpay
razor.api.key=${RAZOR_API}
razor.api.secret=${RAZOR_SECRET}

# Cloudinary (image storage)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart upload limits (restaurant/menu images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
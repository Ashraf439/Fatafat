spring.application.name=Fatafat
spring.datasource.url=jdbc:mysql://localhost:3306/fatafat
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

admin.seed.email=${ADMIN_EMAIL}
admin.seed.password=${ADMIN_PASSWORD}

logging.level.org.springframework.security=DEBUG

jwt.secret=change-this-to-a-long-random-base64-string-at-least-256-bits
jwt.expiration-ms=86400000

user.not.found=User not found with emailId %s

cors.allowed-origins=http://localhost:3000

spring.data.redis.host=localhost
spring.data.redis.port=6379
